function timePeriod(t){var h=new Date(t).getHours();return h<5||h>=19?'night':h<10?'morning':h<15?'day':h<17?'afternoon':'sunset';}

async function fetchWeather(coords){var controller=typeof AbortController!=='undefined'?new AbortController():null,timeout;try{var request=fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(coords.lat)+'&longitude='+encodeURIComponent(coords.lon)+'&current=temperature_2m,weather_code&timezone=auto',{signal:controller?controller.signal:undefined});var response=await Promise.race([request,new Promise(function(resolve,reject){timeout=setTimeout(function(){if(controller)controller.abort();reject(Error('Koneksi cuaca terlalu lama. Coba lagi atau pilih manual.'));},12000);})]);if(!response.ok)throw Error('Layanan cuaca belum tersedia.');var data=await response.json();if(!data.current||!Number.isFinite(data.current.temperature_2m))throw Error('Data cuaca belum lengkap.');var w=weatherFromCode(data.current.weather_code);return {kind:w.kind,storm:w.storm,temp:data.current.temperature_2m,at:Date.now()};}finally{clearTimeout(timeout);}}
async function refreshWeather(){if(weatherBusy||!weatherCoords||atmos.mode!=='auto')return;var generation=weatherGeneration;weatherBusy=true;weatherAttempt=Date.now();paintAtmosphere();try{var result=await fetchWeather(weatherCoords);if(generation!==weatherGeneration)return;atmos.cache=result;weatherError='';saveAtmos();}catch(e){if(generation===weatherGeneration)weatherError='Pembaruan cuaca gagal';throw e;}finally{weatherBusy=false;paintAtmosphere();}}
async function enableWeather(){if(weatherBusy)return;if(!navigator.geolocation){toast('Lokasi tidak tersedia di preview ini. Pilih cuaca manual.');return;}var generation=++weatherGeneration;weatherBusy=true;weatherError='';weatherDialog();paintAtmosphere();try{var pos=await new Promise(function(resolve,reject){navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:600000});});if(generation!==weatherGeneration)return;var coords={lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100};var result=await fetchWeather(coords);if(generation!==weatherGeneration)return;weatherCoords=coords;atmos.mode='auto';atmos.cache=result;weatherAttempt=Date.now();saveAtmos();closeModal();toast('Cuaca sekitar aktif. Hujan tetap tidak menggantikan siraman belajar.');}catch(e){if(generation===weatherGeneration){weatherError=e.code===1?'Izin lokasi belum diberikan':e.code===2?'Lokasi belum ditemukan':e.code===3?'Pencarian lokasi terlalu lama':e.message||'Cuaca belum tersedia';toast(weatherError+'. Pilihan manual tetap bisa dipakai.');}}finally{weatherBusy=false;paintAtmosphere();if(modalKind==='weather')weatherDialog();}}

function textHash(v){var n=2166136261;for(var i=0;i<v.length;i++){n^=v.charCodeAt(i);n=Math.imul(n,16777619);}return n>>>0;}
function dailyMotivation(t){var k=day(t),h=textHash(k);return motivationOpen[h%24]+' '+motivationVerb[Math.floor(h/24)%24]+' '+motivationEnd[Math.floor(h/576)%24];}
function motivationHTML(){return '<article class="motivation-card"><div class="motivation-mark">✦</div><div class="grow"><div class="eyebrow">KALIMAT HARI INI</div><p>“'+esc(dailyMotivation(now()))+'”</p><small>13.824 kombinasi motivasi · berganti sekali sehari</small></div>'+btn('motivation-info','ⓘ','iconbtn','aria-label="Tentang motivasi harian"')+'</article>';}
function mikoReplyFor(s,t,text){var q=String(text||'').toLowerCase(),p=plantState(s,t),mins=Math.floor(secondsToday(s,t)/60);if(/malas|capek|lelah|ngantuk/.test(q))return 'Aku dengar kamu lagi berat. Istirahat sebentar boleh, Hanifan—setelah itu kita pilih satu tugas kecil saja. Tanamanmu tidak meminta sempurna, hanya dirawat.';if(/kimia|redoks|biloks|oksidasi/.test(q))return 'Kalau Kimia terasa seperti puzzle, pecah satu konsep dulu. Tulis: siapa yang biloksnya naik, siapa yang turun. Aku senang menemanimu mengulang.';if(/matematika|peluang|kombin|aritmetika/.test(q))return 'Untuk Matematika, jangan lompat langkah. Tulis diketahui, yang ditanya, lalu satu operasi pertama. Pelan tapi jelas, ya.';if(/kedokter|sn|tka|ujian|mimpi/.test(q))return 'Tujuanmu besar, tapi tugas hari ini boleh kecil. '+mins+' menit yang kamu kumpulkan tetap menjadi batu pijakan menuju Kedokteran.';if(/tanaman|pohon|layu|siram|kebun/.test(q))return p.dead?'Tanaman ini sedang menunggu perjalanan baru. Riwayatmu tidak hilang—kita bisa menanam lagi saat kamu siap.':'Tanamanmu sekarang '+p.status+' dengan '+p.growth+'/84 hari tumbuh. Airnya datang dari sesi belajar yang kamu simpan.';if(/halo|hai|hi|pagi|sore|malam/.test(q))return 'Meong, Hanifan 🐈 Aku Miko. Ceritakan saja apa pun—belajar, bingung, atau cuma ingin ditemani sebentar.';var replies=['Aku catat, Hanifan. Dari semua hal itu, mana satu langkah yang paling kecil dan bisa kamu mulai sekarang?','Aku di sini. Tarik napas pelan, lalu ceritakan bagian yang paling mengganggu pikiranmu.','Menarik. Kita tidak perlu menyelesaikan semuanya sekaligus; satu konsep dahulu cukup.','Aku tidak menghakimi. Coba ubah ceritamu menjadi satu tindakan kecil untuk sepuluh menit ke depan.','Terima kasih sudah cerita. Bahkan percakapan ini bisa menjadi jeda yang membuatmu kembali fokus.'];return replies[textHash(text)%replies.length];}
function mikoDialog(){var history=(S.chat||[]).slice(-24),body=history.length?history.map(function(x){return '<div class="chat-bubble '+x.role+'"><small>'+ (x.role==='miko'?'Miko':'Hanifan')+'</small><p class="pre">'+esc(x.text)+'</p></div>';}).join(''):'<div class="chat-bubble miko"><small>Miko</small><p>Meong 🐈 Aku teman lokalmu. Mau cerita, tanya soal belajar, atau cuma ditemani?</p></div>';openModal('Miko · teman kebun','<div class="chat-log">'+body+'</div><form id="mikoForm"><label>Pesan untuk Miko<textarea name="message" rows="3" maxlength="600" required placeholder="Contoh: Miko, aku lagi malas belajar…"></textarea></label><button class="primary full">Kirim ke Miko</button><p class="fine">Miko adalah teman lokal berbasis aturan di file ini—bukan layanan AI online. Tidak ada pesan yang dikirim ke server.</p></form>','miko');}
async function sendMiko(text){var msg=String(text||'').trim();if(!msg){toast('Tulis pesan untuk Miko dahulu.');return;}await change(function(s,t){if(!s.chat)s.chat=[];s.chat.push({role:'user',text:msg,at:t});s.chat.push({role:'miko',text:mikoReplyFor(s,t,msg),at:t});if(s.chat.length>100)s.chat=s.chat.slice(-100);});mikoDialog();}
var decorationIds=['butterfly','mushroom','stones','fence','bird','fireflies','garland','windchime','tea','rabbit'];
function decorationsHTML(){return decorationIds.map(function(k){if(!S.equip[k])return '';var x=catalog.find(function(v){return v.id===k;});if(!x)return '';return '<span class="scene-decoration decor-'+k+'" aria-label="'+esc(x.name)+'">'+x.icon+'</span>';}).join('');}
var cityResults=[],cityName='';
function cityLabel(x){return [x.name,x.admin1,x.country].filter(Boolean).join(', ');}
function weatherDialog(){var results=cityResults.map(function(x,i){return '<button type="button" class="secondary city-result" data-act="weather-city" data-id="'+i+'">'+esc(cityLabel(x))+'</button>';}).join('');openModal('Langit di kebunmu','<p>Latar mengikuti jam HP: pagi, siang, sore, senja, lalu malam. Cuaca hujan hanya mengubah suasana—siraman tetap berasal dari belajar.</p><div class="weather-status">'+esc(weatherSummary())+'</div><h3>Cuaca otomatis</h3><p class="fine">Pilih kota agar pembaruan cuaca tetap bisa dipakai meski izin lokasi HP bermasalah. Perlu internet.</p><form id="weatherCityForm"><label>Nama kota<input name="city" maxlength="80" required value="'+esc(cityName)+'" placeholder="Contoh: Medan, Jakarta, Padang"></label><button class="primary full">Cari kota</button></form>'+(results?'<div class="city-results">'+results+'</div>':'')+'<p class="fine">Atau gunakan lokasi perangkat (HTTPS/GitHub Pages biasanya meminta izin lokasi).</p>'+btn('weather-auto',weatherBusy?'Mengambil cuaca…':'📍 Gunakan lokasi perangkat','secondary full',weatherBusy?'disabled':'')+'<hr><h3>Pilih sendiri, bisa offline</h3><div class="weather-options">'+[['off','Ikuti waktu saja'],['clear','☀ Cerah'],['cloud','☁ Berawan'],['rain','🌧 Hujan']].map(function(x){return btn('weather-set',x[1],atmos.mode===x[0]?'primary':'secondary','data-id="'+x[0]+'"');}).join('')+'</div><p class="fine">Sumber cuaca otomatis: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p>','weather');}
async function searchCities(name){cityName=String(name||'').trim();if(cityName.length<2){toast('Tulis nama kota minimal 2 huruf.');return;}weatherBusy=true;cityResults=[];weatherError='';weatherDialog();try{var r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(cityName)+'&count=6&language=id&format=json');if(!r.ok)throw Error('Pencarian kota gagal.');var d=await r.json();if(!d.results||!d.results.length)throw Error('Kota tidak ditemukan. Coba nama kota lain.');cityResults=d.results;}catch(e){weatherError=e.message||'Pencarian kota gagal';toast(weatherError+'. Pilih cuaca manual jika sedang offline.');}finally{weatherBusy=false;weatherDialog();}}
async function chooseCity(index){var x=cityResults[index];if(!x)return;var coords={lat:Math.round(x.latitude*100)/100,lon:Math.round(x.longitude*100)/100};weatherBusy=true;weatherError='';weatherDialog();try{var result=await fetchWeather(coords);weatherCoords=coords;atmos.coords=coords;atmos.mode='auto';atmos.cache=result;weatherAttempt=Date.now();saveAtmos();cityName=cityLabel(x);cityResults=[];closeModal();toast('Cuaca '+cityName+' aktif di kebunmu.');}catch(e){weatherError=e.message||'Cuaca kota belum tersedia';toast(weatherError+'. Pilih cuaca manual untuk tetap memakai latar hujan.');}finally{weatherBusy=false;paintAtmosphere();if(modalKind==='weather')weatherDialog();}}
async function retryWeather(){if(weatherCoords){try{await refreshWeather();toast('Cuaca diperbarui.');}catch(e){toast('Cuaca belum bisa diperbarui; data terakhir tetap dipakai.');}}else weatherDialog();}
function celestialPosition(t){var d=new Date(t),m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60,daylight=m>=300&&m<1140,from=daylight?300:1140,span=daylight?840:600,passed=daylight?m-from:(m>=1140?m-from:m+1440-from),p=clamp(passed/span,0,1);return {night:!daylight,x:5+90*p,y:63-49*Math.sin(Math.PI*p)};}
function wildlifeHTML(t){var period=timePeriod(t),minute=new Date(t).getMinutes(),flies='';if(period==='night'){for(var i=0;i<15;i++)flies+='<i class="live-firefly" style="--x:'+((i*29+minute*2)%94+3)+'%;--y:'+((i*17+minute)%52+22)+'%;--delay:'+(-i*.34)+'s"></i>';return '<div class="wildlife night-wildlife" aria-hidden="true"><span class="live-bat bat-one">🦇</span><span class="live-bat bat-two">🦇</span><span class="live-owl">🦉</span><div class="live-fireflies">'+flies+'</div></div>';}if(period==='morning')return '<div class="wildlife" aria-hidden="true"><span class="live-bird bird-one">🐦</span><span class="live-bird bird-two">🐦</span><span class="live-butterfly">🦋</span></div>';if(period==='day')return '<div class="wildlife" aria-hidden="true"><span class="live-bird bird-one">🐦</span><span class="live-bee">🐝</span><span class="live-butterfly">🦋</span><span class="live-ladybug">🐞</span></div>';if(period==='afternoon')return '<div class="wildlife" aria-hidden="true"><span class="live-bird bird-two">🐦</span><span class="live-butterfly">🦋</span><span class="live-rabbit">🐇</span></div>';return '<div class="wildlife" aria-hidden="true"><span class="live-swallow">🐦</span><span class="live-rabbit">🐇</span><span class="live-bee">🐝</span></div>';}
function decorationsHTML(){return wildlifeHTML(now())+decorationIds.map(function(k){if(!S.equip[k])return '';var x=catalog.find(function(v){return v.id===k;});if(!x)return '';return '<span class="scene-decoration decor-'+k+'" aria-label="'+esc(x.name)+'">'+x.icon+'</span>';}).join('');}
function attachJournalDeleteControls(){if(page!=='journal'||!document.querySelectorAll)return;var cards=document.querySelectorAll('.entry'),entries=S.sessions.slice().sort(function(a,b){return b.at-a.at;});cards.forEach(function(card,i){if(!entries[i]||!card.querySelector||card.querySelector('[data-note-delete]'))return;var host=card.querySelector('.row:last-of-type')||card,button=document.createElement('button');button.type='button';button.className='textbtn delete-note';button.dataset.noteDelete='ask';button.dataset.id=entries[i].id;button.setAttribute('aria-label','Hapus catatan '+entries[i].topic);button.textContent='🗑 Hapus';host.appendChild(button);});}
function askDeleteNote(sessionId){var note=S.sessions.find(function(x){return x.id===sessionId;});if(!note)return;openModal('Hapus catatan?','<p>Catatan <strong>'+esc(note.topic)+'</strong> akan dihapus dari Jurnal beserta jadwal ulangannya. Siraman, koin, tanaman, dan foto Kenangan tetap aman.</p><div class="row">'+ '<button type="button" class="secondary grow" data-act="close">Kembali</button><button type="button" class="primary grow" data-note-delete="confirm" data-id="'+esc(sessionId)+'">Hapus catatan</button></div>');}
async function deleteNote(sessionId){await change(function(s){var related=s.reviews.filter(function(r){return r.sessionId===sessionId;}).map(function(r){return r.id;});s.sessions=s.sessions.filter(function(x){return x.id!==sessionId;});s.reviews=s.reviews.filter(function(r){return r.sessionId!==sessionId;});s.reviewLog=s.reviewLog.filter(function(r){return related.indexOf(r.reviewId)<0;});});closeModal();toast('Catatan dan jadwal ulangannya dihapus.');}
document.addEventListener('click',async function(e){var b=e.target.closest('[data-note-delete]');if(!b)return;try{if(b.dataset.noteDelete==='ask')askDeleteNote(b.dataset.id);else if(b.dataset.noteDelete==='confirm')await deleteNote(b.dataset.id);}catch(err){toast(err.message||'Catatan belum terhapus.');}});
function paintAtmosphere(){var el=$('.scene');if(el){var period=scenePeriod(Date.now()),w=currentWeather();el.className='scene '+period+' weather-'+w.kind+(w.storm?' storm':'');var names={morning:'Pagi yang segar',day:'Siang di kebunmu',afternoon:'Sore yang hangat',sunset:'Senja yang lembut',night:'Malam yang tenang'},label=$('[data-scene-note]');if(label)label.textContent=names[period]+(S.equip.scene==='auto'?' · waktu HP':' · tema pilihan');var chip=$('[data-weather-label]');if(chip)chip.textContent=(w.kind==='rain'?'🌧 ':w.kind==='cloud'?'☁ ':w.kind==='clear'?'☀ ':'☁ ')+'Atur cuaca';var status=$('[data-weather-status]');if(status)status.textContent=weatherSummary();var orb=$('[data-sun-orb]'),pos=celestialPosition(Date.now());if(orb){if(orb.style&&orb.style.setProperty){orb.style.setProperty('--orbit-x',pos.x+'%');orb.style.setProperty('--orbit-y',pos.y+'%');}orb.className='sky-orb'+(pos.night?' moon':'');if(orb.setAttribute)orb.setAttribute('aria-label',pos.night?'Bulan bergerak mengikuti waktu HP':'Matahari bergerak mengikuti waktu HP');}}attachJournalDeleteControls();}
try{if(atmos&&atmos.mode==='auto'){var savedAtmos=JSON.parse(localStorage.getItem(ATMOS_KEY)||'null');if(savedAtmos&&savedAtmos.coords&&Number.isFinite(savedAtmos.coords.lat)&&Number.isFinite(savedAtmos.coords.lon)){weatherCoords=savedAtmos.coords;atmos.coords=savedAtmos.coords;}}}catch(ignoreAtmos){}
