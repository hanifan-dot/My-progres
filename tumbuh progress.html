document.addEventListener('change',function(e){if(e.target.id==='timerMode'){$('#timerMinutes').disabled=e.target.value==='free';$('#timerDurationField').hidden=e.target.value==='free';}if(e.target.id==='soundKind'){soundKind=e.target.value;if(audio)audio.filter.frequency.setTargetAtTime(soundKind==='wind'?420:1700,audio.ctx.currentTime,.1);}});
function rememberDraft(e){var el=e.target;if(!el.closest||!el.closest('#startForm'))return;if(['subject','topic','mode','minutes'].indexOf(el.name)>=0)draft[el.name]=el.name==='minutes'?Number(el.value):el.value;}
document.addEventListener('input',rememberDraft);document.addEventListener('change',rememberDraft);
document.addEventListener('input',function(e){if(e.target.id==='volume'){volume=Number(e.target.value);if(audio)audio.gain.gain.setTargetAtTime(volume/100*.4,audio.ctx.currentTime,.1);}});
document.addEventListener('keydown',function(e){if(e.target.matches('.leaf-memory')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if($('#modalShade').hidden)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){var all=Array.from($('#modal').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,[tabindex="0"]')).filter(function(x){return x.offsetParent!==null;}),first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('storage',function(e){if(e.key!==KEY||!e.newValue)return;try{S=validate(JSON.parse(e.newValue));render();}catch(err){toast('Data dari tab lain tidak dapat dibaca.');}});
async function tick(){clockPaint();if(atmos.mode==='auto'&&weatherCoords&&!weatherBusy&&Date.now()-weatherAttempt>=1800000)refreshWeather().catch(function(){});if(busy)return;var a=S.active,t=now();if(signature()!==renderSignature||(a&&a.running&&elapsed(a,t)>=a.limit)||(!S.plant.deadAt&&plantState(S,t).dead)){busy=true;try{await change(function(){});}catch(err){toast(err.message);}finally{busy=false;}}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
/* Atmosphere is cosmetic: rain never replaces a learning session. */
var ATMOS_KEY=KEY+'-atmosphere',atmos={mode:'off',cache:null},weatherCoords=null,weatherBusy=false,weatherAttempt=0,weatherError='',weatherGeneration=0;
try{var ap=JSON.parse(localStorage.getItem(ATMOS_KEY)||'null');if(ap&&['off','clear','cloud','rain','auto'].indexOf(ap.mode)>=0){atmos.mode=ap.mode;if(ap.cache&&typeof ap.cache.at==='number'&&Number.isFinite(ap.cache.at)&&['clear','cloud','rain'].indexOf(ap.cache.kind)>=0&&Number.isFinite(ap.cache.temp)&&typeof ap.cache.storm==='boolean')atmos.cache=ap.cache;}}catch(ignore){}
function saveAtmos(){try{localStorage.setItem(ATMOS_KEY,JSON.stringify(atmos));}catch(ignore){}}
function timePeriod(t){var h=new Date(t).getHours();return h<5||h>=19?'night':h<10?'morning':h<15?'day':h<17?'afternoon':'sunset';}
function scenePeriod(t){return S.equip.scene==='auto'?timePeriod(t):S.equip.scene;}
function weatherFromCode(code){if(!Number.isInteger(code)||[0,1,2,3,45,48,51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].indexOf(code)<0)throw Error('Data cuaca belum lengkap.');return {kind:code>=51?'rain':code>=2?'cloud':'clear',storm:code>=95};}
function currentWeather(){if(atmos.mode==='auto'){var c=atmos.cache;if(c&&Date.now()-c.at>=0&&Date.now()-c.at<5400000)return c;return {kind:'off',storm:false};}return {kind:atmos.mode,storm:false};}
function weatherSummary(){var w=currentWeather(),labels={off:'Cuaca belum diaktifkan',clear:'Cerah',cloud:'Berawan',rain:w.storm?'Hujan petir':'Hujan'};if(weatherBusy)return 'Mengambil cuaca sekitar…';if(atmos.mode!=='auto')return labels[w.kind]+(atmos.mode==='off'?' · pilih cuaca di atas':' · pilihan manual');if(w.kind==='off')return (weatherError||'Data cuaca belum tersedia')+' · pilih Atur cuaca untuk mencoba lagi';return labels[w.kind]+' · '+Math.round(w.temp)+'°C · Open-Meteo, '+new Date(w.at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+(weatherError?' · pembaruan gagal, memakai data terakhir':!weatherCoords?' · aktifkan lokasi untuk pembaruan':'');}
function landscapeHTML(){var flowers='',stars='',drops='';for(var i=0;i<14;i++){var x=15+i*44,y=256+(i%3)*10;flowers+='<g transform="translate('+x+' '+y+')"><path d="M0 15 Q-3 5 0 -2" stroke="#4c7754" stroke-width="2"/><path d="M0 10 Q-10 0 -12 6 Q-8 13 0 10" fill="#729564"/><circle cx="-4" cy="-3" r="4" fill="'+(i%2?'#efd8ab':'#d7bfd2')+'"/><circle cx="4" cy="-3" r="4" fill="'+(i%2?'#efd8ab':'#d7bfd2')+'"/><circle cy="-7" r="4" fill="'+(i%2?'#efd8ab':'#d7bfd2')+'"/><circle cy="-3" r="2.8" fill="#cbac62"/></g>';}
for(var j=0;j<24;j++){stars+='<i style="left:'+((j*37+11)%100)+'%;top:'+((j*23+8)%58)+'%;animation-delay:'+(j%5)+'s"></i>';drops+='<i style="left:'+((j*19+3)%100)+'%;animation-delay:'+(-j*.13)+'s;animation-duration:'+(0.65+(j%4)*.13)+'s"></i>';}
return '<div class="landscape" aria-hidden="true"><div class="sky-stars">'+stars+'</div><div class="sky-orb"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><svg class="meadow" viewBox="0 0 640 300" preserveAspectRatio="none"><path class="hill-far" d="M0 180 Q80 95 190 169 T440 142 T640 155 V300 H0Z"/><path class="hill-near" d="M0 224 Q120 162 258 215 T492 205 T640 191 V300 H0Z"/><path d="M0 280 Q180 245 330 275 T640 268 V300 H0Z" fill="#bac08a" opacity=".35"/>'+flowers+'</svg><div class="rainfall">'+drops+'</div></div>';}
function paintAtmosphere(){var el=$('.scene');if(!el)return;var period=scenePeriod(Date.now()),w=currentWeather();el.className='scene '+period+' weather-'+w.kind+(w.storm?' storm':'');var names={morning:'Pagi yang segar',day:'Siang di kebunmu',afternoon:'Sore yang hangat',sunset:'Senja yang lembut',night:'Malam yang tenang'},label=$('[data-scene-note]');if(label)label.textContent=names[period]+(S.equip.scene==='auto'?' · waktu HP':' · tema pilihan');var chip=$('[data-weather-label]');if(chip)chip.textContent=(w.kind==='rain'?'🌧 ':w.kind==='cloud'?'☁ ':w.kind==='clear'?'☀ ':'☁ ')+'Atur cuaca';var status=$('[data-weather-status]');if(status)status.textContent=weatherSummary();}
function weatherDialog(){openModal('Langit di kebunmu','<p>Latar otomatis mengikuti jam HP: pagi, siang, sore, senja, lalu malam. Pilih <b>Cahaya alami</b> di Dekorasi untuk mengikuti waktu.</p><div class="weather-status">'+esc(weatherSummary())+'</div><h3>Cuaca sekitar</h3><p class="fine">Dengan tombol ini, browser meminta izin lokasi. Koordinat dikirim ke Open-Meteo untuk mengambil perkiraan cuaca sekitar. Perlu internet; cuaca bisa berbeda dari keadaan tepat di rumahmu.</p>'+btn('weather-auto',weatherBusy?'Mengambil cuaca…':'📍 Gunakan lokasi & cuaca otomatis','primary full',weatherBusy?'disabled':'')+'<p class="fine">Diperbarui setiap 30 menit selama halaman aktif. Setelah membuka ulang, tekan tombol lokasi untuk melanjutkan pembaruan. Koordinat tidak disimpan di cadangan.</p><hr><h3>Pilih sendiri, bisa offline</h3><div class="weather-options">'+[['off','Ikuti waktu saja'],['clear','☀ Cerah'],['cloud','☁ Berawan'],['rain','🌧 Hujan']].map(function(x){return btn('weather-set',x[1],atmos.mode===x[0]?'primary':'secondary','data-id="'+x[0]+'"');}).join('')+'</div><p class="fine">Hujan hanya mengubah suasana. Tanaman tetap mendapat siraman dari belajarmu. Sumber cuaca: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p>','weather');}
function setWeather(mode){if(['off','clear','cloud','rain'].indexOf(mode)<0)return;weatherGeneration++;atmos.mode=mode;weatherCoords=null;weatherError='';saveAtmos();closeModal();paintAtmosphere();toast('Suasana kebun diperbarui.');}
async function fetchWeather(coords){var controller=typeof AbortController!=='undefined'?new AbortController():null,timeout;try{var request=fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(coords.lat)+'&longitude='+encodeURIComponent(coords.lon)+'&current=temperature_2m,weather_code&timezone=auto',{signal:controller?controller.signal:undefined});var response=await Promise.race([request,new Promise(function(resolve,reject){timeout=setTimeout(function(){if(controller)controller.abort();reject(Error('Koneksi cuaca terlalu lama. Coba lagi atau pilih manual.'));},12000);})]);if(!response.ok)throw Error('Layanan cuaca belum tersedia.');var data=await response.json();if(!data.current||!Number.isFinite(data.current.temperature_2m))throw Error('Data cuaca belum lengkap.');var w=weatherFromCode(data.current.weather_code);return {kind:w.kind,storm:w.storm,temp:data.current.temperature_2m,at:Date.now()};}finally{clearTimeout(timeout);}}
async function refreshWeather(){if(weatherBusy||!weatherCoords||atmos.mode!=='auto')return;var generation=weatherGeneration;weatherBusy=true;weatherAttempt=Date.now();paintAtmosphere();try{var result=await fetchWeather(weatherCoords);if(generation!==weatherGeneration)return;atmos.cache=result;weatherError='';saveAtmos();}catch(e){if(generation===weatherGeneration)weatherError='Pembaruan cuaca gagal';throw e;}finally{weatherBusy=false;paintAtmosphere();}}
async function enableWeather(){if(weatherBusy)return;if(!navigator.geolocation){toast('Lokasi tidak tersedia di preview ini. Pilih cuaca manual.');return;}var generation=++weatherGeneration;weatherBusy=true;weatherError='';weatherDialog();paintAtmosphere();try{var pos=await new Promise(function(resolve,reject){navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:600000});});if(generation!==weatherGeneration)return;var coords={lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100};var result=await fetchWeather(coords);if(generation!==weatherGeneration)return;weatherCoords=coords;atmos.mode='auto';atmos.cache=result;weatherAttempt=Date.now();saveAtmos();closeModal();toast('Cuaca sekitar aktif. Hujan tetap tidak menggantikan siraman belajar.');}catch(e){if(generation===weatherGeneration){weatherError=e.code===1?'Izin lokasi belum diberikan':e.code===2?'Lokasi belum ditemukan':e.code===3?'Pencarian lokasi terlalu lama':e.message||'Cuaca belum tersedia';toast(weatherError+'. Pilihan manual tetap bisa dipakai.');}}finally{weatherBusy=false;paintAtmosphere();if(modalKind==='weather')weatherDialog();}}

/* BOOT */
reconcile(S,now());persist();render();if(!storageOK)toast('Penyimpanan belum tersedia atau data lama tidak terbaca. Gunakan cadangan.');setInterval(tick,1000);
})();
